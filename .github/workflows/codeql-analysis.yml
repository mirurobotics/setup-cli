name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: '31 7 * * 3'
  workflow_call:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: typescript
          source-root: src

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
