name: CodeQL

on:
  schedule:
    - cron: '31 7 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      # The nightly run skips the scan when main hasn't moved since the last
      # successful run, so quiet repos don't rescan the same commit.
      - name: Check for commits since the last scan
        id: check
        uses: mirurobotics/workflows/actions/codeql-gate@933d1b4bf17071ae9bb9f8120d57dce4381a37da

  codeql:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.scan != 'false' }}
    runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: typescript, actions

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
